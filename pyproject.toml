[project]
name = "freetokens-daily"
version = "1.0.0"
description = "AIHOT free-token inventory and reusable provider runners"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31,<3",
]

[tool.ruff]
target-version = "py39"
extend-exclude = ["__pycache__"]

[tool.ruff.lint]
# Keep CI focused on syntax and undefined-name failures. The provider scripts
# intentionally use their own long-standing formatting and logging styles.
select = ["E9", "F63", "F7", "F82"]
