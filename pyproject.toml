[project]
name = "freetokens-daily"
version = "1.0.2"
description = "AIHOT free-token inventory and provider scheduler"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31,<3",
]

[tool.ruff]
target-version = "py39"
extend-exclude = ["__pycache__"]

[tool.ruff.lint]
# Keep CI focused on syntax and undefined-name failures.
select = ["E9", "F63", "F7", "F82"]
