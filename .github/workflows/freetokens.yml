name: FreeTokens Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "17 23 * * *"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      PYTHONUTF8: "1"
      MEOO_COOKIES: ${{ secrets.MEOO_COOKIES }}
      MEOO_COOKIE: ${{ secrets.MEOO_COOKIE }}
      MOBILECLAW_TOKENS: ${{ secrets.MOBILECLAW_TOKENS }}
      MOBILECLAW_TOKEN: ${{ secrets.MOBILECLAW_TOKEN }}
      INKSTONE_TOKENS: ${{ secrets.INKSTONE_TOKENS }}
      INKSTONE_TOKEN: ${{ secrets.INKSTONE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run bundled providers
        run: python run_all.py --bundled-only --json freetokens-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freetokens-report
          path: freetokens-report.json
          if-no-files-found: warn
